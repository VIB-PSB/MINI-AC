name: MINI-AC test suite

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  nf-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Prepare nf-test config file
      run: sed -i -e "s@%TMP%@${RUNNER_TEMP}@g" tests/nextflow.config

    - uses: actions/setup-java@v3
      with:
        distribution: oracle
        java-version: 17
    
    - name: Check Java version
      run: java -version

    - name: Setup Nextflow
      uses: nf-core/setup-nextflow@v1

    - name: Setup nf-test
      run: wget -qO- https://code.askimed.com/install/nf-test | bash

    - name: Fetch motif mapping files
      run: |
        curl -k -L -o tests/data/zma_v4_chr1/zma_v4_genome_wide_motif_mappings_chr1.bed https://ftp.psb.ugent.be/pub/software/mini_ac/test_files/zma_v4_genome_wide_motif_mappings_chr1.bed
        curl -k -L -o tests/data/zma_v4_chr1/zma_v4_locus_based_motif_mappings_5kbup_1kbdown_chr1.bed https://ftp.psb.ugent.be/pub/software/mini_ac/test_files/zma_v4_locus_based_motif_mappings_5kbup_1kbdown_chr1.bed
        curl -k -L -o data/ath/ath_genome_wide_motif_mappings.bed https://ftp.psb.ugent.be/pub/software/mini_ac/test_files/ath_genome_wide_motif_mappings.bed
        curl -k -L -o data/ath/ath_locus_based_motif_mappings_5kbup_1kbdown.bed https://ftp.psb.ugent.be/pub/software/mini_ac/test_files/ath_locus_based_motif_mappings_5kbup_1kbdown.bed

    - name: Disable container awareness
      run: export NXF_OPTS='-XX:-UseContainerSupport'
    
    - name: Check versions
      run: |
        nextflow info

    - name: Run nf-test
      shell: bash
      run: ./nf-test test
